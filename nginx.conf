user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
                    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    upstream backend_servers {
        server backend:5000;
    }

    # HTTP (Port 80) configuration for SSL handshake & redirects
    server {
        listen 80;
        server_name api.swaranbhumi.com;
        
        # Let's Encrypt certbot challenge route path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (Port 443) configuration
    server {
        listen 443 ssl;
        server_name api.swaranbhumi.com;

        # SSL Certificates path mapping (mounted from Let's Encrypt certbot volumes)
        ssl_certificate /etc/letsencrypt/live/api.swaranbhumi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.swaranbhumi.com/privkey.pem;

        # Secure SSL ciphers settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Maximum body upload size (for attachments e.g. 10MB)
        client_max_body_size 10M;

        # Socket.IO and REST API proxying
        location / {
            proxy_pass http://backend_servers;
            
            # Proxy headers mapping
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Socket.IO / WebSocket upgrade mapping
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
