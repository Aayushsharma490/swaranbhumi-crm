version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crmpassword
      POSTGRES_DB: swaranbhumi_crm
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    volumes:
      - redis_prod_data:/data
    expose:
      - "6379"
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: crm-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:crmpassword@postgres:5432/swaranbhumi_crm?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=swaranbhumi_production_jwt_access_secret_key_8899_xyz
      - JWT_REFRESH_SECRET=swaranbhumi_production_jwt_refresh_secret_key_9988_abc
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - DEFAULT_VERIFY_TOKEN=swaranbhumi_production_meta_verify_token_9900
    depends_on:
      - postgres
      - redis
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: crm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot_path:/var/www/certbot
    depends_on:
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: crm-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot_path:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_prod_data:
  redis_prod_data:
  backend_uploads:
  backend_logs:
  certbot_etc:
  certbot_var:
  webroot_path:
